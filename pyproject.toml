[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recops"
version = "0.1.0"
description = "Two-stage recommender system with an MLOps lifecycle around it"
readme = "README.md"
requires-python = ">=3.10,<3.15"
# Core: what unit tests and data code need. Heavy deps live in extras.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "polars>=1.0",
    "pyarrow>=15",
    "pydantic>=2.5",
    "pyyaml>=6",
]

[project.optional-dependencies]
ml = ["implicit>=0.7", "catboost>=1.2", "huggingface-hub>=0.23"]
tracking = ["mlflow>=2.10"]
serve = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]
dev = ["pytest>=8", "ruff>=0.4", "pre-commit>=3", "uv>=0.4"]
# Apache Airflow is deliberately NOT here: it needs its own constraints file and runs in a
# separate container (docker-compose.yml). It cannot run on Kaggle.

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: end-to-end smoke (needs implicit, catboost, mlflow)"]
